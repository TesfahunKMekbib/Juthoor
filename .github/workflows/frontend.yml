name: Frontend CI

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main, feature]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Dart format · Flutter analyze · Flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # Baseline debt (docs/open-questions.md Q-D2): formatting reports but does not block
      # until the repository variable STRICT_CHECKS is set to "true".
      STRICT: ${{ vars.STRICT_CHECKS == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6   # matches frontend/.metadata
          cache: true

      - name: Install
        run: flutter pub get

      - name: Detect tests
        id: detect
        run: |
          if [ -d test ]; then echo "has_tests=true" >> "$GITHUB_OUTPUT"; echo "dirs=lib test" >> "$GITHUB_OUTPUT"
          else echo "has_tests=false" >> "$GITHUB_OUTPUT"; echo "dirs=lib" >> "$GITHUB_OUTPUT"; fi

      - name: Dart format
        id: format
        continue-on-error: ${{ vars.STRICT_CHECKS != 'true' }}
        run: dart format --output=none --set-exit-if-changed ${{ steps.detect.outputs.dirs }}

      - name: Flutter analyze
        id: analyze
        run: flutter analyze

      - name: Flutter test
        id: test
        if: steps.detect.outputs.has_tests == 'true'
        run: flutter test --coverage

      - name: Report
        if: always()
        run: |
          icon() { case "$1" in success) echo "✅ pass";; failure) if [ "$2" = "baseline" ] && [ "$STRICT" != "true" ]; then echo "⚠️ fail (non-blocking baseline, Q-D2)"; else echo "❌ fail"; fi;; skipped) echo "⏭️ skipped (no frontend/test yet)";; *) echo "$1";; esac; }
          {
            echo "## Frontend checks"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| dart format | $(icon '${{ steps.format.outcome }}' baseline) |"
            echo "| flutter analyze | $(icon '${{ steps.analyze.outcome }}') |"
            echo "| flutter test | $(icon '${{ steps.test.outcome }}') |"
          } >> "$GITHUB_STEP_SUMMARY"
