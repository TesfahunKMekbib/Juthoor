screen:
  id: profile
  title: My profile

theme:
  brightness: dark
  fontFamily: Roboto
  colors:
    background: "#0E1714"
    surface: "#16211D"
    border: "#2A3832"
    accent: "#3FA977"
    accentBorder: "#2F7A57"
    textPrimary: "#F2F5F3"
    textSecondary: "#A9B5AF"
    navInactive: "#B9C3BE"
  typography:
    screenTitle: { size: 20, weight: 700, color: textPrimary }
    tileTitle: { size: 13.5, weight: 700, color: textPrimary }
    tileSubtitle: { size: 12, weight: 400, color: textSecondary }
    button: { size: 14, weight: 600, color: textPrimary }
    navLabel: { size: 12, weight: 400, color: navInactive }
    navLabelActive: { size: 12, weight: 700, color: textPrimary }

layout:
  type: scrollList
  padding: { left: 14, top: 16, right: 14, bottom: 24 }

components:
  tile:
    background: surface
    border: { color: border, width: 1 }
    borderRadius: 12
    padding: { horizontal: 12, vertical: 11 }
    spacingBelow: 8
    defaultTrailing: { type: icon, icon: chevron_right, size: 18, color: textSecondary }

body:
  - type: text
    style: screenTitle
    value: My profile
    padding: { left: 2, bottom: 12 }

  - type: tile
    id: account
    title: Rashid Al Nuaimi
    subtitle: UAE PASS verified · Dubai
    trailing:
      type: textButton
      label: Edit
      color: accent
      action: editProfile

  - type: tile
    id: levelBadges
    title: Level and badges
    subtitle: Level 3 · 2 of 3 unlocked
    action: openLevelBadges

  - type: tile
    id: notifications
    title: Notifications
    subtitle: Reminders and results
    action: openNotifications

  - type: tile
    id: privacy
    title: Privacy and recommendations
    subtitle: "Profile visible to: Everyone"
    action: openPrivacy

  - type: tile
    id: language
    title: Language
    subtitle: English / العربية
    action: openLanguage

  - type: tile
    id: interests
    title: Interests
    subtitle: Transit, Planting
    action: openInterests

  - type: tile
    id: pointsHistory
    title: Points history
    action: openPointsHistory

  - type: outlinedButton
    id: signOut
    label: Sign out
    height: 42
    borderRadius: 12
    border: { color: accentBorder, width: 1.5 }
    style: button
    spacingAbove: 2
    action: signOut

  - type: textLink
    id: deleteAccount
    label: Delete my account
    align: center
    underline: true
    style: button
    spacingAbove: 14
    action: deleteAccount

bottomNavigation:
  height: 52
  background: background
  borderTop: { color: border, width: 1 }
  indicator: { position: top, height: 3, color: accent }
  selectedIndex: 4
  items:
    - { id: home, label: Home }
    - { id: activities, label: Activities }
    - { id: impact, label: Impact }
    - { id: assistant, label: Assistant }
    - { id: profile, label: Profile }
